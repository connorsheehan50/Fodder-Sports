<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team | Fodder Sports</title>
  <meta name="description" content="Team feed: Fodder Sports stories, record, schedule, and results.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/sports.css">
</head>
<body>

<header class="site-header"></header>

<main class="container sp-wrap">
  <div id="tm-hero"></div>
  <div class="tm-layout">
    <section>
      <h2 class="tm-h2">Fodder Sports coverage</h2>
      <div id="tm-feed" class="feed"><div class="sp-msg">Loading…</div></div>
    </section>
    <aside>
      <div class="tm-box"><h2 class="tm-h2" id="tm-sched-h">Schedule &amp; results</h2><div id="tm-sched"><div class="tm-empty">Loading…</div></div></div>
      <div class="tm-box"><h2 class="tm-h2">Standings</h2><div id="tm-standing"><div class="tm-empty">Loading…</div></div></div>
    </aside>
  </div>
  <p class="sp-source">Data from ESPN, updated live.</p>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <span class="footer-label">Fodder Sports · Pilot</span>
      <p class="footer-note">Summaries written from published coverage. Not affiliated with any league or team.</p>
    </div>
  </div>
</footer>

<script src="/js/teams-data.js"></script>
<script src="/js/fs-sports.js"></script>
<script src="/js/main.js"></script>
<script src="/js/team.js"></script>
<script src="/js/chrome.js"></script>

</html>
