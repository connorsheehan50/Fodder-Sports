<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Your Account — Fodder Sports</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--page-bg); }
    .signup-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 16px 60px;
    }
    .signup-logo {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--ink);
      text-decoration: none;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .signup-logo span { color: var(--orange); }
    .signup-card {
      background: var(--card-bg);
      border: 1px solid var(--rule);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: 32px;
    }
    .step { display: none; }
    .step.active { display: block; }
    .step-heading {
      font-family: var(--font-display);
      font-size: 26px;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .step-sub {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--slate);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .oauth-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-oauth {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: var(--card-bg);
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      text-align: center;
    }
    .btn-oauth:hover { background: rgba(0,0,0,.03); border-color: #aaa; }
    .btn-oauth svg { flex-shrink: 0; }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      font-family: var(--font-head);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      color: var(--slate-light);
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule);
    }
    .form-field { margin-bottom: 16px; }
    .form-field label {
      display: block;
      font-family: var(--font-head);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 6px;
    }
    .form-field input {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: var(--page-bg);
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--ink);
      box-sizing: border-box;
      transition: border-color 0.15s;
    }
    .form-field input:focus { outline: none; border-color: var(--orange); }
    .form-field input.error { border-color: #E53E3E; }
    .field-error {
      font-family: var(--font-body);
      font-size: 12px;
      color: #E53E3E;
      margin-top: 4px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      padding: 13px 16px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: var(--font-head);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 8px;
    }
    .btn-primary:hover { opacity: 0.88; }
    .sign-in-link {
      text-align: center;
      margin-top: 20px;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--slate);
    }
    .sign-in-link a, .sign-in-link button {
      color: var(--orange);
      text-decoration: none;
      background: none;
      border: none;
      font: inherit;
      cursor: pointer;
      padding: 0;
    }
    /* ── Team Picker Step ── */
    .sport-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .sport-tab {
      font-family: var(--font-head);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 6px 12px;
      border: 1px solid var(--rule);
      border-radius: 20px;
      background: transparent;
      color: var(--slate);
      cursor: pointer;
      transition: all 0.1s;
    }
    .sport-tab.active {
      background: var(--ink);
      color: var(--off-white);
      border-color: var(--ink);
    }
    .team-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
      margin-bottom: 24px;
    }
    .team-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: var(--card-bg);
      cursor: pointer;
      transition: all 0.1s;
      text-align: left;
    }
    .team-btn.selected {
      border-color: var(--orange);
      background: rgba(255,77,0,.06);
    }
    .team-btn img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .team-btn-name {
      font-family: var(--font-head);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
      color: var(--ink);
      line-height: 1.3;
    }
    .selected-count {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--slate);
      margin-bottom: 16px;
    }
    .selected-count strong { color: var(--ink); }
    .skip-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--slate);
      cursor: pointer;
      background: none;
      border: none;
      text-decoration: underline;
    }
    /* Sign in panel */
    #panel-signin { display: none; }
    #panel-signin.active { display: block; }
    #panel-signup { display: block; }
    #panel-signup.hidden { display: none; }
  </style>
</head>

<div class="signup-wrap">

            Continue with Facebook
          </button>
        </div>

        <div class="divider">or</div>

        <div class="form-field">
          <label>Email address</label>
          <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
          <div class="field-error" id="err-email"></div>
        </div>
        <div class="form-field">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="At least 8 characters" autocomplete="new-password">
          <div class="field-error" id="err-password"></div>
        </div>

        <button class="btn-primary" onclick="submitSignup()">Create Account</button>

        <div class="sign-in-link">Already have an account? <button onclick="showSignIn()">Sign in</button></div>
      </div>

      <div id="panel-signin">
        <div class="step-heading">Welcome back</div>
        <div class="step-sub">Sign in to your Fodder Sports account.</div>

        <div class="form-field">
          <label>Email address</label>
          <input type="email" id="signin-email" placeholder="you@example.com" autocomplete="email">
          <div class="field-error" id="err-signin-email"></div>
        </div>
        <div class="form-field">
          <label>Password</label>
          <input type="password" id="signin-password" placeholder="Your password" autocomplete="current-password">
          <div class="field-error" id="err-signin-password"></div>
        </div>

        <button class="btn-primary" onclick="submitSignIn()">Sign In</button>
        <div class="sign-in-link">New here? <button onclick="showSignup()">Create a free account</button></div>
      </div>
    </div>

    <!-- STEP 2: Team Selection -->
    <div class="step" id="step-teams">
      <div class="step-heading">Pick your teams</div>
      <div class="step-sub">Select as many as you like across any sport. Your feed will follow them all.</div>

      <div class="sport-tabs" id="sport-tabs"></div>
      <div class="selected-count" id="selected-count">0 teams selected</div>
      <div class="team-grid" id="team-grid"></div>

      <button class="btn-primary" onclick="finishSetup()">Save &amp; Go to My Feed</button>
      <button class="skip-link" onclick="finishSetup()">Skip for now</button>
    </div>

  </div>
</div>

// ── State ─────────────────────────────────────────────────────
let selectedTeams = {}; // {sport: [team objects]}
let activeSport = 'NFL';
let currentEmail = '';

// ── Load existing account ─────────────────────────────────────
(function() {
  try {
    const acc = JSON.parse(localStorage.getItem('fs_account') || 'null');
    if (acc && acc.email) {
      // Already signed in; redirect to feed
      const dest = getNextUrl();
      window.location.replace(dest);
    }
  } catch(e) {}
})();

function getNextUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('next') || '/nfl/?tab=myfeed';
}

// ── OAuth stubs ───────────────────────────────────────────────
function oauthSignup(provider) {
  // OAuth integration requires a backend for token exchange.
  // For now, collect email via a prompt, skip password.
  const email = window.prompt(`Enter your ${provider === 'google' ? 'Google' : 'Facebook'} email to continue:`);
  if (!email || !email.includes('@')) return;
  currentEmail = email.trim().toLowerCase();
  createAccount(currentEmail, null, provider);
}

// ── Signup form ───────────────────────────────────────────────
function submitSignup() {
  const email = document.getElementById('signup-email').value.trim();
  const pw = document.getElementById('signup-password').value;
  let valid = true;
  document.getElementById('err-email').textContent = '';
  document.getElementById('err-password').textContent = '';
  if (!email || !email.includes('@')) {
    document.getElementById('err-email').textContent = 'Please enter a valid email address.';
    document.getElementById('signup-email').classList.add('error');
    valid = false;
  } else {
    document.getElementById('signup-email').classList.remove('error');
  }
  if (!pw || pw.length < 8) {
    document.getElementById('err-password').textContent = 'Password must be at least 8 characters.';
    document.getElementById('signup-password').classList.add('error');
    valid = false;
  } else {
    document.getElementById('signup-password').classList.remove('error');
  }
  if (!valid) return;
  currentEmail = email.toLowerCase();
  createAccount(currentEmail, pw, 'email');
}

function submitSignIn() {
  const email = document.getElementById('signin-email').value.trim();
  const pw = document.getElementById('signin-password').value;
  let valid = true;
  document.getElementById('err-signin-email').textContent = '';
  document.getElementById('err-signin-password').textContent = '';
  if (!email || !email.includes('@')) {
    document.getElementById('err-signin-email').textContent = 'Please enter a valid email address.';
    valid = false;
  }
  if (!pw) {
    document.getElementById('err-signin-password').textContent = 'Please enter your password.';
    valid = false;
  }
  if (!valid) return;
  try {
    const acc = JSON.parse(localStorage.getItem('fs_account') || 'null');
    if (acc && acc.email === email.toLowerCase() && acc.pw === btoa(pw)) {
      window.location.replace(getNextUrl());
    } else {
      document.getElementById('err-signin-password').textContent = 'Email or password not recognized.';
    }
  } catch(e) {
    document.getElementById('err-signin-password').textContent = 'Sign in failed. Try creating an account.';
  }
}

function createAccount(email, pw, method) {
  try {
    const existing = JSON.parse(localStorage.getItem('fs_account') || 'null');
    const acc = existing || {};
    acc.email = email;
    acc.method = method;
    if (pw) acc.pw = btoa(pw); // minimal obfuscation; no backend = no real security
    acc.teams = acc.teams || {};
    localStorage.setItem('fs_account', JSON.stringify(acc));
  } catch(e) {}
  goToTeamStep();
}

function goToTeamStep() {
  document.getElementById('step-account').classList.remove('active');
  document.getElementById('step-teams').classList.add('active');
  renderSportTabs();
  renderTeamGrid('NFL');
}

function showSignIn() {
  document.getElementById('panel-signup').classList.add('hidden');
  document.getElementById('panel-signin').classList.add('active');
}

function showSignup() {
  document.getElementById('panel-signup').classList.remove('hidden');
  document.getElementById('panel-signin').classList.remove('active');
}

// ── Team picker ───────────────────────────────────────────────
function renderSportTabs() {
  const container = document.getElementById('sport-tabs');
  container.innerHTML = Object.keys(SPORTS).map(sport => `
    <button class="sport-tab ${sport === activeSport ? 'active' : ''}" onclick="switchSport('${sport}')">${sport}</button>
  `).join('');
}

function switchSport(sport) {
  activeSport = sport;
  renderSportTabs();
  renderTeamGrid(sport);
}

function renderTeamGrid(sport) {
  const data = SPORTS[sport];
  if (!data) return;
  const sel = (selectedTeams[sport] || []).map(t => t.abbr);
  const container = document.getElementById('team-grid');
  container.innerHTML = data.teams.map(team => `
    <button class="team-btn ${sel.includes(team.abbr) ? 'selected' : ''}"
      onclick="toggleTeam('${sport}','${team.abbr}','${team.name.replace(/'/g,"\\'")}')">
      <img src="${data.logo(team.abbr)}" alt="${team.name}" onerror="this.style.display='none'">
      <span class="team-btn-name">${team.name}</span>
    </button>
  `).join('');
  updateSelectedCount();
}

function toggleTeam(sport, abbr, name) {
  if (!selectedTeams[sport]) selectedTeams[sport] = [];
  const idx = selectedTeams[sport].findIndex(t => t.abbr === abbr);
  if (idx >= 0) {
    selectedTeams[sport].splice(idx, 1);
  } else {
    selectedTeams[sport].push({abbr, name, sport});
  }
  renderTeamGrid(sport);
}

function updateSelectedCount() {
  const total = Object.values(selectedTeams).reduce((sum, arr) => sum + arr.length, 0);
  const el = document.getElementById('selected-count');
  if (total === 0) {
    el.innerHTML = 'No teams selected yet.';
  } else {
    el.innerHTML = `<strong>${total}</strong> team${total !== 1 ? 's' : ''} selected`;
  }
}

function finishSetup() {
  try {
    const acc = JSON.parse(localStorage.getItem('fs_account') || '{}');
    acc.teams = selectedTeams;
    // Flatten for quick lookup
    acc.allTeams = Object.values(selectedTeams).flat();
    localStorage.setItem('fs_account', JSON.stringify(acc));
  } catch(e) {}
  window.location.replace(getNextUrl());
}
</script>
</body>
</html>
